<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios - CONSTRUTORA CBR</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div>CONSTRUTORA CBR</div>
        <select>
            <option>Selecionar Obra</option>
            <option>Nova Obra</option>
        </select>
        <div>Usuário</div>
    </header>

    <div class="container">

        <aside>
            <div id="menu-obra" onclick="location.href='aba-obra.html'">Obra</div>
            <div id="menu-estoque" onclick="location.href='aba-estoque.html'">Estoque Geral</div>
            <div id="menu-movimentacoes" onclick="location.href='aba-movimentacoes.html'">Movimentações</div>
            <div id="menu-relatorios" class="ativo" onclick="location.href='aba-relatorios.html'">Relatórios</div>
        </aside>

        <main>
            <!-- ABA 4: RELATÓRIOS -->
            <div id="aba-relatorios" class="aba ativa">
                <div class="bloco-topo">
                    <div>Relatórios</div>
                    <div class="botoes">
                        <select>
                            <option>Filtrar Obra</option>
                        </select>
                        <button>Exportar PDF</button>
                        <button>Exportar Excel</button>
                    </div>
                </div>

                <div class="grade-2">
                    <div class="painel">
                        <div>Gráfico Entradas vs Saídas</div>
                        <div class="grafico-box">Área do Gráfico 1</div>
                    </div>
                    <div class="painel">
                        <div>Gráfico Orçado vs Gasto</div>
                        <div class="grafico-box">Área do Gráfico 2</div>
                    </div>
                </div>

                <div class="painel">
                    <div>Fechamento de Obras</div>
                    <table>
                        <thead>
                            <tr>
                                <th>Obra</th>
                                <th>Data Fechamento</th>
                                <th>Total Gasto</th>
                                <th>Saldo Retornado</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>---</td>
                                <td>---</td>
                                <td>---</td>
                                <td>---</td>
                                <td><button>Ver Relatório</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div class="nav-mobile">
        <button onclick="location.href='aba-obra.html'">Obra</button>
        <button onclick="location.href='aba-estoque.html'">Estoque</button>
        <button onclick="location.href='aba-movimentacoes.html'">Movim.</button>
        <button onclick="location.href='aba-relatorios.html'">Relat.</button>
    </div>

</body>

</html>

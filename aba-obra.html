<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obra - CONSTRUTORA CBR</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div>CONSTRUTORA CBR</div>
        <select>
            <option>Selecionar Obra</option>
            <option>Nova Obra</option>
        </select>
        <div>Usuário</div>
    </header>

    <div class="container">

        <aside>
            <div id="menu-obra" class="ativo" onclick="location.href='aba-obra.html'">Obra</div>
            <div id="menu-estoque" onclick="location.href='aba-estoque.html'">Estoque Geral</div>
            <div id="menu-movimentacoes" onclick="location.href='aba-movimentacoes.html'">Movimentações</div>
            <div id="menu-relatorios" onclick="location.href='aba-relatorios.html'">Relatórios</div>
        </aside>

        <main>
            <!-- ABA 1: OBRA -->
            <div id="aba-obra" class="aba ativa">
                <div class="bloco-topo">
                    <div>Nome da Obra / Status</div>
                    <div class="botoes">
                        <button>Alocar do Geral</button>
                        <button>Entrada Direta</button>
                        <button>Transferir</button>
                        <button>Encerrar Obra</button>
                    </div>
                </div>

                <div class="resumo">
                    <div class="caixa">Orçamento</div>
                    <div class="caixa">Gasto</div>
                    <div class="caixa">Total de Itens</div>
                    <div class="caixa">Alertas</div>
                </div>

                <div class="area-dividida">
                    <div class="painel">
                        <div style="display: flex; justify-content: space-between;">
                            <span>Estoque da Obra</span>
                            <input type="text" placeholder="Buscar">
                        </div>
                        <table>
                            <thead>
                                <tr>
                                    <th>Material</th>
                                    <th>Alocado</th>
                                    <th>Usado</th>
                                    <th>Saldo</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>---</td>
                                    <td>---</td>
                                    <td>---</td>
                                    <td>---</td>
                                    <td>
                                        <button>Baixar</button>
                                        <button>Transferir</button>
                                    </td>
                                </tr>
                                <tr>
                                    <td>---</td>
                                    <td>---</td>
                                    <td>---</td>
                                    <td>---</td>
                                    <td>
                                        <button>Baixar</button>
                                        <button>Transferir</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="painel">
                        <div>Histórico</div>
                        <div class="item-lista">Registro 1</div>
                        <div class="item-lista">Registro 2</div>
                        <div class="item-lista">Registro 3</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="nav-mobile">
        <button onclick="location.href='aba-obra.html'">Obra</button>
        <button onclick="location.href='aba-estoque.html'">Estoque</button>
        <button onclick="location.href='aba-movimentacoes.html'">Movim.</button>
        <button onclick="location.href='aba-relatorios.html'">Relat.</button>
    </div>

</body>

</html>
